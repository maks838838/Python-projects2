<!DOCTYPE html>
<html>
    <head>
<title>grid</title>
<style>
    p{
        background-color: aquamarine;
        margin: 0;
    }

</style>
    </head>
    <body>
        <div>
        <p>200px</p>
        <p>75ps</p>
        </div>
        <div>
            <p>col1</p>
            <p>col2</p>
            <p>col3</p>
        </div>
        <div style=" display:grid ; grid-template-columns: 1fr 1fr 1fr 1fr; column-gap: 20px; row-gap: 10px; ">
            <p>col1</p>
            <p>col2</p>
            <p>col3</p>
            <p>col4</p>
            <p>col1</p>
            <p>col2</p>
            <p>col3</p>
            <p>col4</p>
        </div>
    </body>
</html>
